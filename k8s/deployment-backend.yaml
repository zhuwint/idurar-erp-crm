apiVersion: apps/v1
kind: Deployment
metadata:
  name: idurar-backend
  namespace: idurar-erp-crm
  labels:
    app: idurar-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idurar-backend
  template:
    metadata:
      labels:
        app: idurar-backend
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup mongodb.idurar-erp-crm.svc.cluster.local; do
                echo "Waiting for MongoDB Service..."
                sleep 3
              done
      containers:
        - name: backend
          image: idurar-erp-crm-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: idurar-backend-config
            - secretRef:
                name: idurar-backend-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: idurar-backend
  namespace: idurar-erp-crm
  labels:
    app: idurar-backend
spec:
  type: ClusterIP
  selector:
    app: idurar-backend
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
